<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Not found</title>
<style>
html,body{background:#fff;margin:0}
body{color:#16181d;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px 12px}
a{color:#0a3069}
</style>
<script>
/* Comment mode: /<page>/comments loads <page> and adds /comments.js. See COMMENTS.md. */
(function () {
  var p = location.pathname, m = p.match(/^(.*?)\/comments\/?$/);
  if (!m || !m[1]) return;
  if (/\/$/.test(p)) history.replaceState(null, '', p.replace(/\/$/, '') + location.search + location.hash);
  var page = /\.html$/.test(m[1]) ? m[1] : m[1] + '/';
  document.documentElement.style.visibility = 'hidden';
  fetch(page, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function (html) {
    var pre = '<script>window.__vlcPath=' + JSON.stringify(page) + '<\/script>' +
      (/\.html$/.test(page) ? '<base href="' + page.replace(/[^\/]*$/, '') + '">' : '');
    var post = '<script src="/comments.js?v=1"><\/script>';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (t) { return t + pre; }) : pre + html;
    html = /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, post + '</body>') : html + post;
    document.open();
    document.write(html);
    document.close();
  }).catch(function () {
    document.documentElement.style.visibility = '';
  });
})();
</script>
</head>
<body>
<p>Page not found. <a href="/">rahulch.site</a> &middot; <a href="/all/">all pages</a></p>
</body>
</html>
