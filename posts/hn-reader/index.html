<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&display=swap" rel="stylesheet">
<title>Wire — a Hacker News reader</title>
<style>
:root{
  --bg:#faf9f7;
  --panel:#ffffff;
  --panel2:#f0eeea;
  --ink:#1d1f24;
  --ink-dim:#5c6270;
  --ink-faint:#9aa0ad;
  --amber:#d97a00;
  --amber-dim:#b56600;
  --green:#1a8f4a;
  --line:#e4e1db;
  --mono:'SF Mono',ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
  --serif:Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}
a:hover{color:var(--amber)}

header{position:sticky;top:0;z-index:10;background:rgba(250,249,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-size:17px;font-weight:700;letter-spacing:.5px;color:var(--amber)}
.logo span{color:var(--ink-faint);font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;color:var(--ink-dim);font-family:var(--mono);font-size:13px;padding:5px 10px;cursor:pointer;border-radius:4px}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--panel2);color:var(--amber)}
.search{margin-left:auto}
.tm input{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;outline:none}
.tm input:focus{border-color:var(--amber-dim)}
.tm input{color:var(--ink);font-weight:700;cursor:pointer}
.tm input::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
.leadwrap{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
.shot{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);background:var(--panel2);display:block}
.shot.small{aspect-ratio:16/9;margin-bottom:10px}
.pull{margin-top:12px;padding:10px 14px;border-left:3px solid var(--amber);font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.5;color:var(--ink-dim)}
.pull .who{display:block;margin-top:5px;font-family:var(--mono);font-style:normal;font-size:11px;color:var(--ink-faint)}
.pull.small{font-size:13px;padding:7px 11px;margin-top:9px}
@media (max-width:640px){.leadwrap{grid-template-columns:1fr}}
.tmbanner{margin-bottom:16px;padding:10px 14px;background:var(--panel);border:1px solid var(--amber-dim);border-radius:8px;font-size:13px;color:var(--amber)}
.tmbanner .x{float:right;cursor:pointer;color:var(--ink-dim)}
.tmbanner .x:hover{color:var(--ink)}
.search input{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px;width:170px;outline:none}
.search input:focus{border-color:var(--amber-dim)}

main{max-width:860px;margin:0 auto;padding:18px 20px 80px}
/* NYT-style front page */
.paper{padding-top:6px}
.masthead{text-align:center;position:relative;padding:6px 0 10px}
.masthead .nameplate{font-family:'UnifrakturMaguntia',serif;font-size:56px;line-height:1;color:var(--ink)}
.ear{position:absolute;top:4px;width:150px;font-size:10.5px;line-height:1.45}
.ear.l{left:0;border:1px solid var(--ink);padding:8px;font-family:var(--serif);font-style:italic;text-align:center}
.ear.r{right:0;text-align:left;font-family:var(--serif)}
.ear.r b{font-family:var(--mono);font-size:9px;letter-spacing:1px}
.dateline{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:4px 2px;font-size:11px;font-family:var(--serif);letter-spacing:.5px;margin-bottom:14px}
.dateline .mid{text-transform:uppercase;letter-spacing:2px}
.fp{display:grid;grid-template-columns:1fr 1.55fr 1fr;gap:0}
.fpcol{padding:0 16px;border-right:1px solid var(--line)}
.fpcol:first-child{padding-left:0}
.fpcol:last-child{border-right:none;padding-right:0}
.hl{font-family:'Playfair Display',var(--serif);font-weight:900;line-height:1.12;color:var(--ink)}
.hl a:hover{color:var(--amber)}
.hl.h1x{font-size:26px;text-align:left}
.hl.h2x{font-size:21px;text-transform:uppercase;text-align:center;letter-spacing:.3px}
.hl.h3x{font-size:19px}
.subdeck{font-family:'Playfair Display',var(--serif);font-style:italic;font-weight:500;font-size:14.5px;text-align:center;margin:7px 0;line-height:1.3;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.byline{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-family:var(--serif);font-weight:700;text-align:center;margin:8px 0 6px}
.byline a:hover{color:var(--amber)}
.bodytxt{font-family:var(--serif);font-size:13.5px;line-height:1.42;text-align:justify;hyphens:auto;color:var(--ink)}
.bodytxt p{margin:0 0 7px;text-indent:14px}
.bodytxt p:first-child{text-indent:0}
.bodytxt p:first-child::first-letter{font-size:30px;float:left;line-height:.9;padding-right:4px;font-family:'Playfair Display',serif;font-weight:900}
.centershot{width:100%;border:1px solid var(--line);display:block}
.credit{text-align:right;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;font-family:var(--serif)}
.caption{font-family:var(--serif);font-size:11.5px;font-style:italic;color:var(--ink-dim);margin:3px 0 10px;line-height:1.4}
.storylink{font-size:10px;font-family:var(--mono);color:var(--ink-faint);text-align:center;margin:6px 0 14px}
.storylink a{color:var(--amber-dim)}
.storylink a:hover{color:var(--amber)}
.colrule{border-top:1.5px solid var(--ink);margin:12px 0 10px}
.belowfold{margin-top:16px;border-top:3px double var(--ink);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:0}
.bf{padding:0 16px;border-right:1px solid var(--line)}
.bf:first-child{padding-left:0}
.bf:last-child{border-right:none;padding-right:0}
.idxhead{margin:20px 0 6px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);border-top:1.5px solid var(--ink);padding-top:8px}
.idx{column-count:3;column-gap:26px;column-rule:1px solid var(--line)}
.irow{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.4;font-family:var(--serif)}
.irow .t{font-weight:700}
.irow .t:hover{color:var(--amber)}
.irow .m{color:var(--ink-faint);font-size:10.5px;margin-top:1px;font-family:var(--mono)}
.irow .m a:hover{color:var(--amber)}
.irow .pts{color:var(--amber);font-weight:700}
@media (max-width:760px){
  .masthead .nameplate{font-size:34px}
  .ear{display:none}
  .fp{grid-template-columns:1fr}
  .fpcol{padding:0;border-right:none;border-bottom:1px solid var(--line);margin-bottom:12px;padding-bottom:8px}
  .belowfold{grid-template-columns:1fr}
  .bf{padding:0;border-right:none}
  .idx{column-count:1}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">wire<span>/hn</span></div>
    <nav id="nav"></nav>
    <div class="tm"><input id="tmdate" type="date"></div>
    <div class="search"><input id="q" type="search" placeholder="search... (enter)"></div>
  </div>
</header>
<main id="main"><div class="loading">loading</div></main>

<script>
const FB='https://hacker-news.firebaseio.com/v0';
const ALG='https://hn.algolia.com/api/v1';
const FEEDS=[['top','topstories'],['new','newstories'],['best','beststories'],['ask','askstories'],['show','showstories'],['jobs','jobstories']];
const PAGE=30;
let state={feed:'top',ids:[],shown:0,cache:{}};
const $=s=>document.querySelector(s);
const main=$('#main');

function ago(t){
  const s=Math.floor(Date.now()/1000-t);
  if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function dom(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return''}}
function esc(x){const d=document.createElement('div');d.textContent=x;return d.innerHTML}

function buildNav(){
  const n=$('#nav');
  n.innerHTML=FEEDS.map(([k])=>`<button data-f="${k}" class="${k===state.feed?'on':''}">${k}</button>`).join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>loadFeed(b.dataset.f));
}

async function item(id){
  if(state.cache[id])return state.cache[id];
  const r=await fetch(`${FB}/item/${id}.json`);
  const j=await r.json();
  state.cache[id]=j;
  return j;
}

async function loadFeed(f){
  state.feed=f;buildNav();
  history.replaceState(null,'','#'+f);
  main.innerHTML='<div class="loading">loading</div>';
  const r=await fetch(`${FB}/${FEEDS.find(x=>x[0]===f)[1]}.json`);
  state.ids=await r.json();
  state.shown=0;state.page=[];
  main.innerHTML='<div id="list"></div>';
  await more();
}

async function more(){
  const slice=state.ids.slice(state.shown,state.shown+PAGE);
  const items=await Promise.all(slice.map(item));
  state.page=(state.page||[]).concat(items.filter(Boolean));
  state.shown+=slice.length;
  renderPaper(state.page,$('#list'));
  const old=$('.morebtn');if(old)old.remove();
  if(state.shown<state.ids.length){
    main.insertAdjacentHTML('beforeend','<button class="morebtn">more</button>');
    $('.morebtn').onclick=more;
  }
  bindStoryLinks();
}

function shotHTML(it){
  if(!it.url)return'';
  const src='https://image.thum.io/get/width/640/crop/800/'+encodeURI(it.url);
  return `<img class="centershot" loading="lazy" src="${src}" onerror="this.style.display='none';this.nextElementSibling.style.display='none'" alt="">
  <div class="credit">${dom(it.url)} via thum.io</div>`;
}
function stripTags(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||''}

async function bodyFromComments(it,nWords){
  let kids=it.kids;
  if(!kids){const full=await item(it.id);kids=(full&&full.kids)||[]}
  const cs=(await Promise.all(kids.slice(0,3).map(item))).filter(c=>c&&!c.deleted&&!c.dead&&c.text);
  if(!cs.length)return'';
  let out='',used=0;
  for(const c of cs){
    let t=stripTags(c.text).replace(/\s+/g,' ').trim();
    const words=t.split(' ');
    if(used+words.length>nWords){t=words.slice(0,nWords-used).join(' ')+' ...';used=nWords}
    else used+=words.length;
    out+=`<p><b>${esc(c.by||'?')}:</b> ${esc(t)}</p>`;
    if(used>=nWords)break;
  }
  return out;
}

function meta(it){
  return `${it.score||0} points · ${ago(it.time)} ago · <a class="cbtn" data-open="${it.id}">${it.descendants||0} comments</a>${it.url?` · <a href="${esc(it.url)}" target="_blank" rel="noopener">${dom(it.url)} ↗</a>`:''}`;
}
function tl(it){
  return it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title||'')}</a>`
               :`<a data-open="${it.id}">${esc(it.title||'')}</a>`;
}

function renderPaper(items,list,edition){
  if(!items.length){list.innerHTML='<div class="dead">nothing here</div>';return}
  const [a,b,c,d,e]=items;
  const rest=items.slice(5);
  const totPts=items.reduce((x,y)=>x+(y.score||0),0);
  const totCmt=items.reduce((x,y)=>x+(y.descendants||0),0);
  const dt=edition||new Date();
  const dstr=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).toUpperCase();
  const vol=Math.floor((dt-new Date('2007-02-19'))/86400000);
  const col=(it,hclass)=>it?`
      <div class="hl ${hclass}">${tl(it)}</div>
      <div class="byline">By <a data-open="${it.id}">${esc(it.by||'?')}</a></div>
      <div class="bodytxt" data-body="${it.id}"><p>Loading the discussion...</p></div>
      <div class="storylink">${meta(it)}</div>`:'';
  let h=`<div class="paper">
    <div class="masthead">
      <div class="ear l">"All the links<br>fit to click"</div>
      <div class="nameplate">The Hacker Times</div>
      <div class="ear r"><b>THE NUMBERS</b><br>${items.length} stories on this page carrying ${totPts.toLocaleString()} points and ${totCmt.toLocaleString()} comments. Feed: ${state.feed}.</div>
    </div>
    <div class="dateline">
      <span>VOL. XX .... No. ${vol.toLocaleString()}</span>
      <span class="mid">${dstr}</span>
      <span>FREE AS IN BEER</span>
    </div>
    <div class="fp">
      <div class="fpcol">${col(b,'h3x')}<div class="colrule"></div>${col(d,'h3x')}</div>
      <div class="fpcol">
        ${a?`${shotHTML(a)}
        <div class="caption">${esc(a.title||'')} — the day's most discussed submission, ${a.descendants||0} comments and counting.</div>
        <div class="hl h1x">${tl(a)}</div>
        <div class="byline">By <a data-open="${a.id}">${esc(a.by||'?')}</a></div>
        <div class="bodytxt" data-body="${a.id}"><p>Loading the discussion...</p></div>
        <div class="storylink">${meta(a)}</div>`:''}
      </div>
      <div class="fpcol">${c?`
        <div class="hl h2x">${tl(c)}</div>
        <div class="subdeck">${c.url?dom(c.url):'Discussion'} — ${c.score||0} points in ${ago(c.time)}</div>
        <div class="byline">By <a data-open="${c.id}">${esc(c.by||'?')}</a></div>
        <div class="bodytxt" data-body="${c.id}"><p>Loading the discussion...</p></div>
        <div class="storylink">${meta(c)}</div>`:''}
      </div>
    </div>
    ${e?`<div class="belowfold">
      <div class="bf">${col(e,'h3x')}</div>
      <div class="bf">${rest[0]?col(rest[0],'h3x'):''}</div>
    </div>`:''}`;
  const idxItems=e?rest.slice(1):rest;
  if(idxItems.length){
    h+=`<div class="idxhead">Inside</div><div class="idx">${idxItems.map(it=>`
      <div class="irow">
        <span class="t">${tl(it)}</span>
        <div class="m"><span class="pts">${it.score||0}</span> pts · ${ago(it.time)} · <a class="cbtn" data-open="${it.id}">${it.descendants||0}c</a></div>
      </div>`).join('')}</div>`;
  }
  h+='</div>';
  list.innerHTML=h;
  fillBodies(items.slice(0,7));
}

async function fillBodies(items){
  await Promise.all(items.map(async it=>{
    const el=document.querySelector(`[data-body="${it.id}"]`);
    if(!el)return;
    const isLead=!!el.parentElement.querySelector('.h1x');
    const n=isLead?170:90;
    const html=await bodyFromComments(it,n);
    el.innerHTML=html||'<p><i>No comments yet. Be the first voice on this story.</i></p>';
    bindStoryLinks();
  }));
}

function bindStoryLinks(){
  document.querySelectorAll('[data-open]').forEach(a=>{
    a.onclick=e=>{e.preventDefault();openStory(a.dataset.open)};
  });
}

async function openStory(id){
  main.innerHTML='<div class="loading">loading thread</div>';
  window.scrollTo(0,0);
  const it=await item(id);
  const d=it.url?` · <a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:var(--amber)">${dom(it.url)} ↗</a>`:'';
  main.innerHTML=`
    <span class="back">← back to ${state.feed}</span>
    <div class="dtitle">${esc(it.title||'')}</div>
    <div class="dmeta">${it.score||0} pts · by ${esc(it.by||'?')} · ${ago(it.time)} ago · ${it.descendants||0} comments${d}</div>
    ${it.text?`<div class="dtext">${it.text}</div>`:''}
    <div class="chead">— thread —</div>
    <div id="cmts"><div class="loading">loading comments</div></div>`;
  $('.back').onclick=()=>loadFeed(state.feed);
  const box=$('#cmts');
  box.innerHTML='';
  if(it.kids&&it.kids.length){
    await renderKids(it.kids,box,0,it.by);
  }else{
    box.innerHTML='<div class="dead">no comments yet</div>';
  }
}

async function renderKids(ids,container,depth,op){
  const CHUNK=depth===0?15:ids.length;
  const first=ids.slice(0,CHUNK);
  const rest=ids.slice(CHUNK);
  const items=await Promise.all(first.map(item));
  for(const c of items){
    if(!c||c.deleted)continue;
    const el=document.createElement('div');
    el.className='cmt d'+Math.min(depth,1);
    const kidCount=c.kids?c.kids.length:0;
    el.innerHTML=`
      <div class="cmeta"><span class="au">${esc(c.by||'?')}</span>${c.by===op?'<span class="op">OP</span>':''} ${ago(c.time)} ago <span class="tog">[–]</span></div>
      <div class="ctext">${c.dead?'<span class="dead">[flagged]</span>':(c.text||'')}</div>
      <div class="kids"></div>`;
    const meta=el.querySelector('.cmeta');
    meta.onclick=()=>{
      el.classList.toggle('collapsed');
      meta.querySelector('.tog').textContent=el.classList.contains('collapsed')?`[+${1+countDesc(c)}]`:'[–]';
    };
    container.appendChild(el);
    if(c.kids&&c.kids.length){
      await renderKids(c.kids,el.querySelector('.kids'),depth+1,op);
    }
  }
  if(rest.length){
    const b=document.createElement('button');
    b.className='loadkids';
    b.textContent=`load ${rest.length} more comments`;
    b.onclick=async()=>{b.remove();await renderKids(rest,container,depth,op)};
    container.appendChild(b);
  }
}

function countDesc(c){
  let n=0;
  const walk=x=>{if(x&&x.kids)x.kids.forEach(k=>{n++;const kc=state.cache[k];if(kc)walk(kc)})};
  walk(c);
  return n;
}

$('#q').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim();
  if(!q)return;
  main.innerHTML='<div class="loading">searching</div>';
  const r=await fetch(`${ALG}/search?query=${encodeURIComponent(q)}&tags=story&hitsPerPage=30`);
  const j=await r.json();
  main.innerHTML=`<span class="back">← back to ${state.feed}</span><div id="list"></div>`;
  $('.back').onclick=()=>loadFeed(state.feed);
  renderPaper(j.hits.map(h=>({id:+h.objectID,title:h.title,url:h.url,score:h.points,by:h.author,time:h.created_at_i,descendants:h.num_comments})),$('#list'));
  bindStoryLinks();
});

async function timeMachine(dateStr){
  main.innerHTML='<div class="loading">rewinding</div>';
  const d0=Math.floor(new Date(dateStr+'T00:00:00').getTime()/1000);
  const d1=d0+86400;
  const nf=encodeURIComponent(`created_at_i>${d0},created_at_i<${d1}`);
  const r=await fetch(`${ALG}/search?tags=story&numericFilters=${nf}&hitsPerPage=30`);
  const j=await r.json();
  const nice=new Date(dateStr+'T00:00:00').toDateString();
  main.innerHTML=`<div class="tmbanner">front page of ${nice} — top stories submitted that day, ranked by points<span class="x">✕ exit</span></div><div id="list"></div>`;
  main.querySelector('.x').onclick=()=>{$('#tmdate').value=$('#tmdate').max;loadFeed(state.feed)};
  renderPaper(j.hits.map(h=>({id:+h.objectID,title:h.title,url:h.url,score:h.points,by:h.author,time:h.created_at_i,descendants:h.num_comments})),$('#list'),new Date(dateStr+'T12:00:00'));
  bindStoryLinks();
}
const tmd=$('#tmdate');
tmd.max=new Date().toISOString().slice(0,10);
tmd.min='2007-02-19';
tmd.value=tmd.max;
tmd.addEventListener('change',()=>{
  if(!tmd.value)return;
  if(tmd.value===tmd.max){loadFeed(state.feed);return}
  timeMachine(tmd.value);
});

const initial=location.hash.slice(1);
loadFeed(FEEDS.some(f=>f[0]===initial)?initial:'top');
</script>
</body>
</html>
