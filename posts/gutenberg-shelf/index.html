<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gutenberg Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF8;--ink:#17171C;--cobalt:#2545FF;--muted:#6E6E76;--rule:#E7E7E2;--chip:#EEF1FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
canvas.over{cursor:pointer}
#hud{position:fixed;top:18px;left:20px;pointer-events:none;max-width:min(46vw,420px)}
#hud h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-0.01em}
#keys{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--muted);margin-top:6px;line-height:1.8}
#keys b{font-weight:400;color:var(--ink);background:var(--chip);border-radius:3px;padding:1px 5px}
#ticks{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:2px;padding:0 16px}
#ticks button{width:15px;height:22px;border:0;background:transparent;padding:0;cursor:pointer}
#ticks button i{display:block;width:2px;height:100%;margin:0 auto;background:var(--rule);transition:background .18s,transform .18s}
#ticks button:hover i{background:var(--muted)}
#ticks button.on i{background:var(--cobalt);transform:scaleX(2)}
#ticks button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
#panel{position:fixed;top:0;right:0;width:352px;max-width:84vw;height:100%;background:#fff;border-left:1px solid var(--rule);padding:26px 24px 30px;overflow-y:auto;transform:translateX(102%);transition:transform .34s cubic-bezier(.22,.61,.36,1)}
#panel.open{transform:none}
#panel .rank{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--muted);letter-spacing:0.08em}
#panel h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;line-height:1.25;margin:8px 0 6px;letter-spacing:-0.01em}
#panel .by{font-size:0.94rem;color:var(--muted);margin-bottom:18px}
#panel dl{border-top:1px solid var(--rule);padding-top:14px;font-size:0.86rem}
#panel dt{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#panel dd{margin:0 0 14px;line-height:1.5}
#panel ul{list-style:none;margin:0}
#panel li{margin-bottom:4px;line-height:1.45}
.row{display:flex;gap:8px;margin-bottom:16px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:0.76rem;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;cursor:pointer}
.btn:hover{border-color:var(--cobalt);color:var(--cobalt)}
.btn:disabled{opacity:0.4;cursor:default;border-color:var(--rule);color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.go{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--cobalt);text-decoration:none;border:1px solid var(--cobalt);border-radius:6px;padding:9px 13px}
.go:hover{background:var(--chip)}
#panel .close{position:absolute;top:18px;right:18px;border:0;background:none;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--muted);cursor:pointer}
#panel .close:hover{color:var(--cobalt)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--muted)}
@media (max-width:700px){#panel{width:100%;max-width:100%;height:52%;top:auto;bottom:0;border-left:0;border-top:1px solid var(--rule);transform:translateY(102%)}#panel.open{transform:none}#ticks{bottom:auto;top:78px}#hud{max-width:72vw}#keys{display:none}}
</style>
</head>
<body>
<div id="hud">
  <h1>The Gutenberg Shelf</h1>
  <div id="keys">
    <span><b>drag</b> browse, <b>click</b> pull out</span><br>
    <span><b>arrows</b> book, <b>enter</b> open, <b>esc</b> back</span><br>
    <span>pulled out: <b>drag</b> orbit, <b>shift drag</b> pan, <b>scroll</b> zoom, <b>r</b> reset</span>
  </div>
</div>
<div id="ticks" role="listbox" aria-label="books on the shelf"></div>
<aside id="panel" aria-live="polite">
  <button class="close" id="close">close</button>
  <div class="rank" id="p-rank"></div>
  <h2 id="p-title"></h2>
  <div class="by" id="p-by"></div>
  <div class="row">
    <button class="btn" id="p-prev">&#8592; prev</button>
    <button class="btn" id="p-next">next &#8594;</button>
    <button class="btn" id="p-reset">reset view</button>
  </div>
  <dl>
    <dt>Subjects</dt>
    <dd><ul id="p-subj"></ul></dd>
    <dt>Downloads, last 30 days</dt>
    <dd id="p-dl"></dd>
  </dl>
  <a class="go" id="p-go" href="#" target="_blank" rel="noopener">read at gutenberg.org</a>
</aside>
<div id="load">building the shelf...</div>
<script src="catalog.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CLOTH = ['#7A2E2B','#1F3A5F','#2F4739','#5C3A6E','#8A5A22','#3C3F46','#6B2F4A','#1E4E4A','#8C6B2F','#33385C'];
const FOIL = ['#E7D9B8','#F0E6D2','#D9C48A','#EDE4D0'];
const PAPER = 0xFAFAF8;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DAMP = REDUCED ? 1 : 0.13;

function hash(n){let h=(n*2654435761)%4294967296;return (h^(h>>>15))>>>0;}
function lum(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)/255;}
function wrapText(ctx, text, width, max){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > width && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.slice(0, max);
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.FogExp2(PAPER, 0.016);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0xB9B4A8, 0.85));
const keyLight = new THREE.DirectionalLight(0xfff6e8, 0.95);
keyLight.position.set(3.5, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -9; keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 6; keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xdfe6ff, 0.32);
fillLight.position.set(-5, 3, 4);
scene.add(fillLight);

function spineTexture(book, color){
  const c = document.createElement('canvas');
  c.width = 160; c.height = 1024;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0,0,160,1024);
  const g = x.createLinearGradient(0,0,160,0);
  g.addColorStop(0,'rgba(0,0,0,0.35)'); g.addColorStop(0.28,'rgba(255,255,255,0.07)');
  g.addColorStop(0.72,'rgba(255,255,255,0.04)'); g.addColorStop(1,'rgba(0,0,0,0.38)');
  x.fillStyle = g; x.fillRect(0,0,160,1024);
  const ink = lum(color) > 0.55 ? '#1b1b1f' : FOIL[hash(book.id*5) % FOIL.length];
  x.strokeStyle = ink; x.globalAlpha = 0.5; x.lineWidth = 3;
  x.strokeRect(20, 46, 120, 932);
  x.globalAlpha = 1;
  x.save();
  x.translate(80, 512); x.rotate(Math.PI/2);
  x.fillStyle = ink; x.textAlign = 'center'; x.textBaseline = 'middle';
  let t = book.t.split(/[;:]/)[0].trim();
  if (t.length > 34) t = t.slice(0,32).trim() + '...';
  x.font = '600 62px "Space Grotesk", Georgia, serif';
  x.fillText(t, -40, 0);
  x.globalAlpha = 0.82;
  x.font = '400 40px "IBM Plex Mono", monospace';
  x.fillText(book.a.split(',')[0].toUpperCase(), 300, 0);
  x.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}

function coverTexture(book, color, bare){
  const W = 660, H = 980;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0,0,W,H);
  const seed = hash(book.id * 31);
  const ink = lum(color) > 0.55 ? '#1b1b1f' : FOIL[seed % FOIL.length];
  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgba(255,255,255,0.10)');
  g.addColorStop(1,'rgba(0,0,0,0.22)');
  x.fillStyle = g; x.fillRect(0,0,W,H);
  x.strokeStyle = ink; x.globalAlpha = 0.55; x.lineWidth = 4;
  x.strokeRect(46, 46, W-92, H-92);
  x.lineWidth = 1.5;
  x.strokeRect(62, 62, W-124, H-124);
  x.globalAlpha = 1;

  x.save();
  x.translate(W/2, bare ? H/2 : 520);
  x.strokeStyle = ink; x.fillStyle = ink; x.globalAlpha = 0.7;
  const motif = seed % 4;
  if (motif === 0){
    for (let i=0;i<5;i++){ x.beginPath(); x.arc(0,0,58+i*26,0,Math.PI*2); x.lineWidth = i%2?1.5:3; x.stroke(); }
  } else if (motif === 1){
    x.lineWidth = 3;
    for (let i=-3;i<=3;i++){ x.beginPath(); x.moveTo(i*34,-150); x.lineTo(i*34,150); x.stroke(); }
    x.beginPath(); x.arc(0,0,86,0,Math.PI*2); x.lineWidth = 5; x.stroke();
  } else if (motif === 2){
    x.lineWidth = 3;
    x.beginPath();
    for (let i=0;i<6;i++){ const a = i/6*Math.PI*2 - Math.PI/2; const r = 132; i ? x.lineTo(Math.cos(a)*r, Math.sin(a)*r) : x.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
    x.closePath(); x.stroke();
    x.beginPath(); x.arc(0,0,52,0,Math.PI*2); x.fill();
  } else {
    x.lineWidth = 3;
    for (let i=0;i<7;i++){ x.beginPath(); x.moveTo(-150, -120 + i*40); x.lineTo(150, -120 + i*40); x.globalAlpha = 0.3 + i*0.06; x.stroke(); }
    x.globalAlpha = 0.75;
    x.beginPath(); x.arc(0,-150,44,0,Math.PI*2); x.stroke();
  }
  x.restore();
  x.globalAlpha = 1;

  if (!bare){
    x.fillStyle = ink; x.textAlign = 'center';
    x.font = '700 58px "Space Grotesk", Georgia, serif';
    const title = book.t.split(/[;:]/)[0].trim().toUpperCase();
    const lines = wrapText(x, title, W - 170, 3);
    lines.forEach((l, i) => x.fillText(l, W/2, 200 + i*64));
    x.globalAlpha = 0.85;
    x.font = '400 32px "IBM Plex Mono", monospace';
    x.fillText(book.a.toUpperCase(), W/2, 812);
    x.globalAlpha = 0.55;
    x.font = '400 22px "IBM Plex Mono", monospace';
    x.fillText('PROJECT GUTENBERG', W/2, 864);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}

function pagesTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#EFE7D6'; x.fillRect(0,0,128,128);
  for (let i=0;i<128;i+=2){
    x.globalAlpha = 0.05 + (i%4===0 ? 0.05 : 0);
    x.fillStyle = '#8A7F66';
    x.fillRect(i, 0, 1, 128);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const pagesTex = pagesTexture();

const loader = new THREE.TextureLoader();
const books = [];
const booksGroup = new THREE.Group();
scene.add(booksGroup);

let cursor = 0.28;
let prevCi = -1;
CATALOG.forEach((b, i) => {
  const h = 2.0 + (hash(b.id) % 60) / 100;
  const depth = h * b.ar;
  const thick = 0.17 + Math.min(0.19, (b.d / CATALOG[0].d) * 0.19) + (hash(b.id*7) % 5) / 200;
  let ci = hash(b.id*13) % CLOTH.length;
  if (ci === prevCi) ci = (ci + 3) % CLOTH.length;
  prevCi = ci;
  const color = CLOTH[ci];

  const pages = new THREE.MeshStandardMaterial({map:pagesTex, roughness:0.95});
  const spine = new THREE.MeshStandardMaterial({map:spineTexture(b, color), roughness:0.78});
  const front = new THREE.MeshStandardMaterial({map:coverTexture(b, color, false), roughness:0.72});
  const rear = new THREE.MeshStandardMaterial({map:coverTexture(b, color, true), roughness:0.8});
  if (b.c) loader.load('covers/' + b.c, t => {
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    front.map.dispose();
    front.map = t;
    front.needsUpdate = true;
  });

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(thick, h, depth),
    [front, rear, pages, pages, spine, pages]
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const x = cursor + thick/2;
  mesh.position.set(x, h/2, -0.12);
  mesh.userData = {i, book:b, homeX:x, homeY:h/2, homeZ:-0.12, h, depth, color, pull:0, target:0};
  cursor += thick + 0.012;
  books.push(mesh);
  booksGroup.add(mesh);
});

const span = cursor + 0.28;
const wood = new THREE.MeshStandardMaterial({color:0x6B4A2F, roughness:0.62});
const plank = new THREE.Mesh(new THREE.BoxGeometry(span, 0.14, 1.72), wood);
plank.position.set(span/2, -0.07, -0.12);
plank.receiveShadow = true;
scene.add(plank);
const backPanel = new THREE.Mesh(new THREE.BoxGeometry(span, 3.4, 0.1), new THREE.MeshStandardMaterial({color:0x8C6A4A, roughness:0.8}));
backPanel.position.set(span/2, 1.63, -1.0);
backPanel.receiveShadow = true;
scene.add(backPanel);
[0, span].forEach(sx => {
  const side = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.4, 1.72), wood);
  side.position.set(sx, 1.63, -0.12);
  side.castShadow = true; side.receiveShadow = true;
  scene.add(side);
});
const crown = new THREE.Mesh(new THREE.BoxGeometry(span + 0.16, 0.14, 1.72), wood);
crown.position.set(span/2, 3.33, -0.12);
crown.castShadow = true;
scene.add(crown);

const BROWSE_Y = 1.62, BROWSE_Z = 4.6, LOOK_Y = 1.18;
const MIN_X = 1.2, MAX_X = span - 1.2;
const AZ0 = 0, POL0 = Math.PI/2 - 0.05, RAD0 = 2.45;
const DISPLAY_Y = 1.5, DISPLAY_Z = 1.35;

let mode = 'browse';
let panX = MIN_X, panTarget = MIN_X;
let sel = 0, inspected = null;
let az = AZ0, pol = POL0, rad = RAD0;
const panOff = new THREE.Vector3();
let fogTarget = 0.016;

const camPos = new THREE.Vector3(MIN_X, BROWSE_Y, BROWSE_Z);
const camLook = new THREE.Vector3(MIN_X, LOOK_Y, 0);
const wantPos = new THREE.Vector3();
const wantLook = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);

function clampX(v){ return Math.max(MIN_X, Math.min(MAX_X, v)); }
function resetView(){ az = AZ0; pol = POL0; rad = RAD0; panOff.set(0,0,0); }

const ticksEl = document.getElementById('ticks');
books.forEach((m, i) => {
  const b = document.createElement('button');
  b.innerHTML = '<i></i>';
  b.setAttribute('role','option');
  b.setAttribute('aria-label', CATALOG[i].t + ', ' + CATALOG[i].a);
  b.addEventListener('click', () => inspect(i));
  b.addEventListener('focus', () => { sel = i; if (mode === 'browse') panTarget = clampX(m.userData.homeX); });
  ticksEl.appendChild(b);
});
const tickEls = ticksEl.querySelectorAll('button');

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hover = null, down = null, dragging = false, pinch = 0;
const cv = renderer.domElement;
const touches = new Map();

function pointerNdc(e){
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  touches.set(e.pointerId, e);
  pointerNdc(e);
  down = {x:e.clientX, y:e.clientY, pan:panTarget, az, pol, off:panOff.clone(), shift:e.shiftKey || e.button === 2};
  dragging = false;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, e);
  pointerNdc(e);
  if (touches.size === 2 && mode === 'inspect'){
    const pair = [...touches.values()];
    const d = Math.hypot(pair[0].clientX - pair[1].clientX, pair[0].clientY - pair[1].clientY);
    if (pinch) rad = Math.max(1.35, Math.min(6, rad + (pinch - d) * 0.006));
    pinch = d;
    dragging = true;
    return;
  }
  if (down){
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) dragging = true;
    if (!dragging) return;
    cv.classList.add('dragging');
    if (mode === 'inspect'){
      if (down.shift){
        const right = new THREE.Vector3().subVectors(camPos, camLook).cross(UP).normalize();
        panOff.copy(down.off).addScaledVector(right, -dx * 0.0032 * rad).addScaledVector(UP, dy * 0.0032 * rad);
        panOff.clampLength(0, 1.5);
      } else {
        az = Math.max(-2.2, Math.min(2.2, down.az - dx * 0.0072));
        pol = Math.max(0.5, Math.min(2.4, down.pol - dy * 0.0055));
      }
    } else {
      panTarget = clampX(down.pan - dx * 0.011);
    }
    return;
  }
  if (mode !== 'browse') return;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(books)[0];
  const m = hit ? hit.object : null;
  if (m !== hover){ hover = m; cv.classList.toggle('over', !!m); }
});
['pointerup','pointercancel'].forEach(t => cv.addEventListener(t, e => {
  touches.delete(e.pointerId);
  pinch = 0;
  cv.classList.remove('dragging');
  if (t === 'pointerup' && !dragging){
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(books)[0];
    if (hit) inspect(hit.object.userData.i);
    else if (mode === 'inspect') back();
  }
  down = null;
}));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (mode === 'inspect') rad = Math.max(1.35, Math.min(6, rad + e.deltaY * 0.0022));
  else panTarget = clampX(panTarget + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 0.0032);
}, {passive:false});

addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (mode === 'inspect') back(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    e.preventDefault();
    const next = Math.max(0, Math.min(books.length - 1, sel + (e.key === 'ArrowRight' ? 1 : -1)));
    sel = next;
    if (mode === 'inspect') inspect(next);
    else { panTarget = clampX(books[next].userData.homeX); tickEls[next].focus({preventScroll:true}); }
    return;
  }
  if (e.key === 'Home' || e.key === 'End'){
    const next = e.key === 'Home' ? 0 : books.length - 1;
    sel = next;
    if (mode === 'inspect') inspect(next);
    else { panTarget = clampX(books[next].userData.homeX); tickEls[next].focus({preventScroll:true}); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && mode === 'browse' && document.activeElement === document.body){
    e.preventDefault();
    inspect(sel);
  }
  if ((e.key === 'r' || e.key === 'R') && mode === 'inspect') resetView();
});

const panel = document.getElementById('panel');
document.getElementById('close').addEventListener('click', back);
document.getElementById('p-reset').addEventListener('click', resetView);
document.getElementById('p-prev').addEventListener('click', () => inspect(Math.max(0, sel - 1)));
document.getElementById('p-next').addEventListener('click', () => inspect(Math.min(books.length - 1, sel + 1)));

function inspect(i){
  const m = books[i];
  if (inspected && inspected !== m) inspected.userData.target = 0;
  inspected = m;
  sel = i;
  mode = 'inspect';
  m.userData.target = 1;
  resetView();
  fogTarget = 0.1;
  hover = null;
  cv.classList.remove('over');
  const b = m.userData.book;
  document.getElementById('p-rank').textContent = 'NO. ' + String(i + 1).padStart(2,'0') + ' BY DOWNLOADS';
  document.getElementById('p-title').textContent = b.t;
  const life = (b.by || b.dy) ? ' (' + (b.by || '?') + ' to ' + (b.dy || '?') + ')' : '';
  document.getElementById('p-by').textContent = b.a + life;
  const ul = document.getElementById('p-subj');
  ul.innerHTML = '';
  b.s.forEach(s => { const li = document.createElement('li'); li.textContent = s; ul.appendChild(li); });
  document.getElementById('p-dl').textContent = b.d.toLocaleString();
  document.getElementById('p-go').href = 'https://www.gutenberg.org/ebooks/' + b.id;
  document.getElementById('p-prev').disabled = i === 0;
  document.getElementById('p-next').disabled = i === books.length - 1;
  panel.classList.add('open');
}
function back(){
  if (inspected) inspected.userData.target = 0;
  inspected = null;
  mode = 'browse';
  fogTarget = 0.016;
  panel.classList.remove('open');
  panTarget = clampX(books[sel].userData.homeX);
}

function frame(){
  requestAnimationFrame(frame);
  panX += (panTarget - panX) * (REDUCED ? 1 : 0.1);

  books.forEach(m => {
    const u = m.userData;
    u.pull += (u.target - u.pull) * (REDUCED ? 1 : 0.11);
    const p = u.pull;
    const lift = (p < 0.002 && m === hover) ? 0.16 : 0;
    const turn = Math.max(0, (p - 0.4) / 0.6);
    m.position.y = u.homeY + (DISPLAY_Y - u.homeY) * p;
    m.position.z = u.homeZ + (DISPLAY_Z - u.homeZ) * p + lift;
    m.rotation.y = -Math.PI/2 * turn;
    m.renderOrder = p > 0.01 ? 2 : 0;
  });

  if (mode === 'inspect' && inspected){
    wantLook.set(inspected.userData.homeX, DISPLAY_Y, DISPLAY_Z).add(panOff);
    wantPos.set(
      wantLook.x + rad * Math.sin(pol) * Math.sin(az),
      wantLook.y + rad * Math.cos(pol),
      wantLook.z + rad * Math.sin(pol) * Math.cos(az)
    );
  } else {
    wantLook.set(panX, LOOK_Y, 0);
    wantPos.set(panX, BROWSE_Y, BROWSE_Z);
  }
  camPos.lerp(wantPos, DAMP);
  camLook.lerp(wantLook, DAMP);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  scene.fog.density += (fogTarget - scene.fog.density) * 0.09;

  if (mode === 'browse' && document.activeElement === document.body){
    let best = 1e9;
    books.forEach((m, i) => { const d = Math.abs(m.userData.homeX - panX); if (d < best){ best = d; sel = i; } });
  }
  tickEls.forEach((el, i) => el.classList.toggle('on', i === sel));

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = () => { document.getElementById('load').style.display = 'none'; frame(); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  books.forEach((m, i) => {
    m.material[4].map.dispose();
    m.material[4].map = spineTexture(CATALOG[i], m.userData.color);
    m.material[4].needsUpdate = true;
    m.material[0].needsUpdate = true;
  });
  start();
});
else start();
</script>
