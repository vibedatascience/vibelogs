<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gutenberg Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF8;--ink:#17171C;--cobalt:#2545FF;--muted:#6E6E76;--rule:#E7E7E2;--chip:#EEF1FF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
canvas{display:block;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
canvas.over{cursor:pointer}
#hud{position:fixed;top:18px;left:20px;pointer-events:none}
#hud h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-0.01em}
#hud p{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--muted);margin-top:4px}
#ticks{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:3px;padding:0 16px}
#ticks button{width:14px;height:20px;border:0;background:transparent;padding:0;cursor:pointer}
#ticks button i{display:block;width:2px;height:100%;margin:0 auto;background:var(--rule)}
#ticks button.on i{background:var(--cobalt)}
#panel{position:fixed;top:0;right:0;width:340px;max-width:82vw;height:100%;background:#fff;border-left:1px solid var(--rule);padding:26px 24px;overflow-y:auto;transform:translateX(102%);transition:transform .34s cubic-bezier(.22,.61,.36,1)}
#panel.open{transform:none}
#panel .rank{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:var(--muted);letter-spacing:0.08em}
#panel h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.32rem;line-height:1.25;margin:8px 0 6px;letter-spacing:-0.01em}
#panel .by{font-size:0.94rem;color:var(--muted);margin-bottom:18px}
#panel dl{border-top:1px solid var(--rule);padding-top:14px;font-size:0.86rem}
#panel dt{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#panel dd{margin:0 0 14px;line-height:1.5}
#panel ul{list-style:none;margin:0}
#panel li{margin-bottom:4px;line-height:1.45}
#panel .go{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--cobalt);text-decoration:none;border:1px solid var(--cobalt);border-radius:6px;padding:8px 12px}
#panel .go:hover{background:var(--chip)}
#panel .close{position:absolute;top:18px;right:18px;border:0;background:none;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--muted);cursor:pointer}
#panel .close:hover{color:var(--cobalt)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--muted)}
@media (max-width:640px){#panel{width:100%;max-width:100%;height:46%;top:auto;bottom:0;border-left:0;border-top:1px solid var(--rule);transform:translateY(102%)}#ticks{bottom:auto;top:64px}}
</style>
</head>
<body>
<div id="hud">
  <h1>The Gutenberg Shelf</h1>
  <p>drag or scroll to browse, click a book to pull it out</p>
</div>
<div id="ticks"></div>
<aside id="panel">
  <button class="close" id="close">close</button>
  <div class="rank" id="p-rank"></div>
  <h2 id="p-title"></h2>
  <div class="by" id="p-by"></div>
  <dl>
    <dt>Subjects</dt>
    <dd><ul id="p-subj"></ul></dd>
    <dt>Downloads, last 30 days</dt>
    <dd id="p-dl"></dd>
  </dl>
  <a class="go" id="p-go" href="#" target="_blank" rel="noopener">read at gutenberg.org</a>
</aside>
<div id="load">building the shelf...</div>
<script src="catalog.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CLOTH = ['#7A2E2B','#1F3A5F','#2F4739','#5C3A6E','#8A5A22','#3C3F46','#6B2F4A','#1E4E4A','#8C6B2F','#33385C'];
const PAPER = 0xFAFAF8;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function hash(n){let h=n*2654435761%4294967296;return (h^(h>>>15))>>>0;}
function light(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)/255;}

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.FogExp2(PAPER, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0xB9B4A8, 0.85));
const key = new THREE.DirectionalLight(0xfff6e8, 0.95);
key.position.set(3.5, 7, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9; key.shadow.camera.right = 9;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0006;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.3);
fill.position.set(-5, 3, 4);
scene.add(fill);

function spineTexture(book, color){
  const c = document.createElement('canvas');
  c.width = 160; c.height = 1024;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0,0,160,1024);
  const g = x.createLinearGradient(0,0,160,0);
  g.addColorStop(0,'rgba(0,0,0,0.35)'); g.addColorStop(0.28,'rgba(255,255,255,0.07)');
  g.addColorStop(0.72,'rgba(255,255,255,0.04)'); g.addColorStop(1,'rgba(0,0,0,0.38)');
  x.fillStyle = g; x.fillRect(0,0,160,1024);
  const ink = light(color) > 0.55 ? '#1b1b1f' : '#F2E9D8';
  x.strokeStyle = ink; x.globalAlpha = 0.5; x.lineWidth = 3;
  x.strokeRect(20, 46, 120, 932);
  x.globalAlpha = 1;
  x.save();
  x.translate(80, 512); x.rotate(Math.PI/2);
  x.fillStyle = ink; x.textAlign = 'center'; x.textBaseline = 'middle';
  let t = book.t.split(/[;:]/)[0].trim();
  if (t.length > 34) t = t.slice(0,32).trim() + '...';
  x.font = '600 62px "Space Grotesk", Georgia, serif';
  x.fillText(t, -40, 0);
  x.globalAlpha = 0.82;
  x.font = '400 40px "IBM Plex Mono", monospace';
  x.fillText(book.a.split(',')[0].toUpperCase(), 300, 0);
  x.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}

function pagesTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#EFE7D6'; x.fillRect(0,0,128,128);
  for (let i=0;i<128;i+=2){
    x.globalAlpha = 0.05 + (i%4===0 ? 0.05 : 0);
    x.fillStyle = '#8A7F66';
    x.fillRect(i, 0, 1, 128);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const pagesTex = pagesTexture();

const loader = new THREE.TextureLoader();
const books = [];
const booksGroup = new THREE.Group();
scene.add(booksGroup);

let cursor = 0.28;
let prevCi = -1;
CATALOG.forEach((b, i) => {
  const h = 2.0 + (hash(b.id) % 60) / 100;
  const depth = h * b.ar;
  const thick = 0.17 + Math.min(0.19, (b.d / 160099) * 0.19) + (hash(b.id*7) % 5) / 200;
  let ci = hash(b.id*13) % CLOTH.length;
  if (ci === prevCi) ci = (ci + 3) % CLOTH.length;
  prevCi = ci;
  const color = CLOTH[ci];

  const cloth = new THREE.MeshStandardMaterial({color:new THREE.Color(color), roughness:0.82, metalness:0.02});
  const pages = new THREE.MeshStandardMaterial({map:pagesTex, roughness:0.95});
  const spine = new THREE.MeshStandardMaterial({map:spineTexture(b, color), roughness:0.78});
  const front = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.7});
  loader.load('covers/' + b.c, t => {
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    front.map = t;
    front.needsUpdate = true;
  }, undefined, () => { front.color.set(color); });

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(thick, h, depth),
    [front, cloth, pages, pages, spine, pages]
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const x = cursor + thick/2;
  mesh.position.set(x, h/2, -0.12);
  mesh.userData = {i, book:b, homeX:x, homeY:h/2, homeZ:-0.12, h, depth, color};
  cursor += thick + 0.012;
  books.push(mesh);
  booksGroup.add(mesh);
});

const span = cursor + 0.28;
const wood = new THREE.MeshStandardMaterial({color:0x6B4A2F, roughness:0.62});
const plank = new THREE.Mesh(new THREE.BoxGeometry(span, 0.14, 1.72), wood);
plank.position.set(span/2, -0.07, -0.12);
plank.receiveShadow = true;
scene.add(plank);
const back = new THREE.Mesh(new THREE.BoxGeometry(span, 3.4, 0.1), new THREE.MeshStandardMaterial({color:0x8C6A4A, roughness:0.8}));
back.position.set(span/2, 1.63, -1.0);
back.receiveShadow = true;
scene.add(back);
[0, span].forEach(sx => {
  const side = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.4, 1.72), wood);
  side.position.set(sx, 1.63, -0.12);
  side.castShadow = true; side.receiveShadow = true;
  scene.add(side);
});
const crown = new THREE.Mesh(new THREE.BoxGeometry(span + 0.16, 0.14, 1.72), wood);
crown.position.set(span/2, 3.33, -0.12);
crown.castShadow = true;
scene.add(crown);

const CAM_Z = 4.6, CAM_Y = 1.62, LOOK_Y = 1.18;
const MIN_X = 1.2, MAX_X = span - 1.2;
let panX = MIN_X;
let panTarget = MIN_X;
let focused = null;
let yaw = -Math.PI/2, pitch = 0, dolly = 0;
let fogTarget = 0.018;

camera.position.set(panX, CAM_Y, CAM_Z);
camera.lookAt(panX, LOOK_Y, 0);

const ticks = document.getElementById('ticks');
books.forEach((m, i) => {
  const b = document.createElement('button');
  b.innerHTML = '<i></i>';
  b.title = CATALOG[i].t;
  b.addEventListener('click', () => { panTarget = clamp(m.userData.homeX); if (focused) unfocus(); });
  ticks.appendChild(b);
});
function clamp(v){ return Math.max(MIN_X, Math.min(MAX_X, v)); }

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hover = null;
let down = null, dragging = false;

const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  down = {x:e.clientX, y:e.clientY, pan:panTarget, yaw, pitch};
  dragging = false;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  if (down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) dragging = true;
    if (dragging) {
      cv.classList.add('dragging');
      if (focused) {
        yaw = down.yaw + dx * 0.008;
        pitch = Math.max(-0.8, Math.min(0.8, down.pitch - dy * 0.006));
      } else {
        panTarget = clamp(down.pan - dx * 0.011);
      }
    }
    return;
  }
  if (focused) return;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(books)[0];
  const m = hit ? hit.object : null;
  if (m !== hover) { hover = m; cv.classList.toggle('over', !!m); }
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('dragging');
  if (!dragging) {
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(books)[0];
    if (hit) focus(hit.object);
    else if (focused) unfocus();
  }
  down = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (focused) dolly = Math.max(-0.9, Math.min(1.6, dolly + e.deltaY * 0.0016));
  else panTarget = clamp(panTarget + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 0.0032);
}, {passive:false});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && focused) unfocus();
  if (focused) return;
  if (e.key === 'ArrowRight') panTarget = clamp(panTarget + 0.42);
  if (e.key === 'ArrowLeft') panTarget = clamp(panTarget - 0.42);
});

const panel = document.getElementById('panel');
document.getElementById('close').addEventListener('click', unfocus);

function focus(m){
  if (focused === m) return;
  if (focused) { focused.userData.out = false; }
  focused = m;
  m.userData.out = true;
  yaw = -Math.PI/2; pitch = 0; dolly = 0;
  fogTarget = 0.115;
  panTarget = clamp(m.userData.homeX);
  hover = null;
  cv.classList.remove('over');
  const b = m.userData.book;
  document.getElementById('p-rank').textContent = 'NO. ' + String(m.userData.i + 1).padStart(2,'0') + ' BY DOWNLOADS';
  document.getElementById('p-title').textContent = b.t;
  const life = (b.by || b.dy) ? ' (' + (b.by || '?') + ' to ' + (b.dy || '?') + ')' : '';
  document.getElementById('p-by').textContent = b.a + life;
  const ul = document.getElementById('p-subj');
  ul.innerHTML = '';
  b.s.forEach(s => { const li = document.createElement('li'); li.textContent = s; ul.appendChild(li); });
  document.getElementById('p-dl').textContent = b.d.toLocaleString();
  document.getElementById('p-go').href = 'https://www.gutenberg.org/ebooks/' + b.id;
  panel.classList.add('open');
}
function unfocus(){
  if (focused) focused.userData.out = false;
  focused = null;
  fogTarget = 0.018;
  panel.classList.remove('open');
}

const ease = REDUCED ? 1 : 0.12;
const tickEls = ticks.querySelectorAll('button');

function frame(){
  requestAnimationFrame(frame);
  panX += (panTarget - panX) * (REDUCED ? 1 : 0.1);
  camera.position.set(panX, CAM_Y, CAM_Z);
  camera.lookAt(panX, LOOK_Y, 0);
  scene.fog.density += (fogTarget - scene.fog.density) * 0.09;

  books.forEach(m => {
    const u = m.userData;
    const isF = m === focused;
    const tx = isF ? panX - (innerWidth > 640 ? 0.62 : 0) : u.homeX;
    const ty = isF ? CAM_Y - 0.12 : u.homeY;
    const tz = isF ? CAM_Z - 1.55 - dolly : (m === hover ? u.homeZ + 0.16 : u.homeZ);
    const ry = isF ? yaw : 0;
    const rx = isF ? pitch : 0;
    m.position.x += (tx - m.position.x) * ease;
    m.position.y += (ty - m.position.y) * ease;
    m.position.z += (tz - m.position.z) * ease;
    m.rotation.y += (ry - m.rotation.y) * ease;
    m.rotation.x += (rx - m.rotation.x) * ease;
    m.renderOrder = isF ? 2 : 0;
  });

  let near = 0, best = 1e9;
  books.forEach((m, i) => { const d = Math.abs(m.userData.homeX - panX); if (d < best) { best = d; near = i; } });
  tickEls.forEach((el, i) => el.classList.toggle('on', i === near));

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = () => { document.getElementById('load').style.display = 'none'; frame(); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { books.forEach((m,i) => { m.material[4].map.dispose(); m.material[4].map = spineTexture(CATALOG[i], m.userData.color); m.material[4].needsUpdate = true; }); start(); });
else start();
</script>
</body>
</html>
