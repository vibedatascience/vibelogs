<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Rahul">
<title>vibelogs — chat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--red:#E60023;--navy:#0a3069;--teal:#0d9488;--slate:#64748b;--bg:#f8fafc;--card:#fff;--ink:#0f172a;--line:#e2e8f0;
--mono:'IBM Plex Mono',monospace;--disp:'Archivo',sans-serif;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;display:flex;flex-direction:column}
.wrap{max-width:820px;width:100%;margin:0 auto;padding:36px 20px 20px;display:flex;flex-direction:column;flex:1;min-height:0}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;margin:8px 0 6px}
.lede{color:#334155;font-size:14.5px;max-width:640px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 12px}
.bar label{font-family:var(--mono);font-size:12px;color:var(--slate)}
select{font-family:var(--mono);font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
select:focus{outline:2px solid var(--navy)}
.btn{font-family:var(--body);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#c4001e}
.btn:disabled{opacity:.5;cursor:default}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;flex:1;min-height:420px;overflow:hidden}
.log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:11px 14px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#f1f5f9;color:var(--ink);border-bottom-left-radius:4px;white-space:normal}
.msg.bot p{margin:0 0 8px}.msg.bot p:last-of-type{margin-bottom:0}
.msg.bot ul,.msg.bot ol{margin:4px 0 8px 20px}
.msg.bot li{margin:2px 0}
.msg.bot h1,.msg.bot h2,.msg.bot h3{font-family:var(--disp);font-size:15px;margin:10px 0 4px}
.msg.bot code{font-family:var(--mono);font-size:12.5px;background:#e2e8f0;padding:1px 5px;border-radius:4px}
.msg.bot pre{background:#0f172a;color:#e2e8f0;padding:10px 12px;border-radius:8px;overflow-x:auto;margin:6px 0 8px;font-size:12.5px;line-height:1.5}
.msg.bot pre code{background:none;padding:0;color:inherit;font-size:inherit}
.msg.bot table{border-collapse:collapse;margin:6px 0;font-size:13px}
.msg.bot th,.msg.bot td{border:1px solid #cbd5e1;padding:4px 8px}
.msg.bot blockquote{border-left:3px solid #cbd5e1;padding-left:10px;color:var(--slate);margin:6px 0}
.msg.bot a{color:var(--red)}
.msg.err{align-self:flex-start;background:#fde8ec;color:#a3001a;font-family:var(--mono);font-size:12.5px}
.who{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:4px;display:block}
.compose{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#fff}
textarea{flex:1;font-family:var(--body);font-size:14.5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;resize:none;min-height:44px;max-height:160px;line-height:1.45}
textarea:focus{outline:2px solid var(--navy)}
.foot{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.foot a{color:var(--red);text-decoration:none}
.hint{font-family:var(--mono);font-size:11px;color:var(--slate)}
.tok{font-family:var(--mono);font-size:10.5px;opacity:.6;margin-top:6px;display:block}
.dots::after{content:'';animation:d 1.2s infinite}
@keyframes d{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">llm-apps</div>
  <h1>chat</h1>
  <p class="lede">A plain chat window over OpenRouter. No server, no login, no history saved. Runs on a small prepaid balance; when it is empty the page stops answering.</p>

  <div class="bar">
    <label for="model">model</label>
    <select id="model">
      <option value="mistralai/mistral-nemo">mistralai/mistral-nemo ($0.019 / $0.03)</option>
      <option value="qwen/qwen3.7-flash">qwen/qwen3.7-flash ($0.03 / $0.13)</option>
      <option value="openai/gpt-oss-20b">openai/gpt-oss-20b ($0.03 / $0.13)</option>
      <option value="deepseek/deepseek-v4-flash">deepseek/deepseek-v4-flash ($0.08 / $0.16)</option>
      <option value="meta-llama/llama-3.1-8b-instruct">meta-llama/llama-3.1-8b-instruct ($0.05 / $0.08)</option>
      <option value="openai/gpt-5-nano">openai/gpt-5-nano ($0.05 / $0.40)</option>
    </select>
    <span class="hint">prices are $ per 1M tokens, in / out</span>
    <button class="btn" id="clear">clear</button>
  </div>

  <div class="stage">
    <div class="log" id="log"></div>
    <div class="compose">
      <textarea id="input" placeholder="Type a message. Enter to send, Shift+Enter for a new line." rows="1"></textarea>
      <button class="btn primary" id="send">send</button>
    </div>
  </div>

  <div class="foot">
    <span id="usage">0 tokens / $0.00000 this session</span>
    <span><a href="../">back to vibelogs</a></span>
  </div>
</div>

<script>
const KEY=atob('c2stb3ItdjEtZDAxYjlmNjhkOWFiY2JlYWJlYTU2OWNhMzA1YWZiMzM0YjlhY2NkZmY0M2MxNDFiZDQ1MmJjYzRmZmZkZjJkMg==');
const URL='https://openrouter.ai/api/v1/chat/completions';
const log=document.getElementById('log'),input=document.getElementById('input'),send=document.getElementById('send'),modelSel=document.getElementById('model'),usage=document.getElementById('usage');
let history=[],tokens=0,cost=0,busy=false;

function add(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML='<span class="who">'+(role==='user'?'you':role==='bot'?'model':'error')+'</span>';
  d.appendChild(document.createTextNode(text));
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
  return d;
}

async function ask(){
  const text=input.value.trim();
  if(!text||busy)return;
  busy=true;send.disabled=true;
  input.value='';input.style.height='auto';
  add('user',text);
  history.push({role:'user',content:text});
  const pending=add('bot','');
  pending.appendChild(Object.assign(document.createElement('span'),{className:'dots'}));
  try{
    const r=await fetch(URL,{method:'POST',headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json','HTTP-Referer':location.origin,'X-Title':'vibelogs chat'},
      body:JSON.stringify({model:modelSel.value,messages:history.slice(-20),max_tokens:800,usage:{include:true}})});
    const j=await r.json();
    if(j.error)throw new Error(j.error.message||JSON.stringify(j.error));
    const reply=j.choices[0].message.content;
    pending.lastChild.remove();
    const body=document.createElement('div');
    body.innerHTML=DOMPurify.sanitize(marked.parse(reply));
    pending.appendChild(body);
    history.push({role:'assistant',content:reply});
    const u=j.usage||{};
    const t=document.createElement('span');t.className='tok';
    t.textContent=(u.prompt_tokens||0)+' in / '+(u.completion_tokens||0)+' out'+(u.cost!=null?' / $'+Number(u.cost).toFixed(6):'');
    pending.appendChild(t);
    tokens+=u.total_tokens||0;cost+=Number(u.cost||0);
    usage.textContent=tokens.toLocaleString()+' tokens / $'+cost.toFixed(5)+' this session';
  }catch(e){
    pending.remove();
    history.pop();
    add('err',e.message);
  }
  busy=false;send.disabled=false;input.focus();
}

send.onclick=ask;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
document.getElementById('clear').onclick=()=>{history=[];log.innerHTML='';input.focus();};
input.focus();
</script>
</body>
</html>
