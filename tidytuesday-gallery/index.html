<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nrennie / tidytuesday gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/r.min.js"></script>
<style>
:root{
  --ink:#1a1a2e; --paper:#f6f5f1; --card:#ffffff; --accent:#D7331D;
  --muted:#7a7a8c; --line:#e4e2da;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}
header{padding:56px 32px 20px;max-width:1400px;margin:0 auto}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(32px,5vw,56px);letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:8px;font-size:15px;max-width:640px}
.bar{position:sticky;top:0;z-index:20;background:rgba(246,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-inner{max-width:1400px;margin:0 auto;padding:12px 32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.lang.on{background:var(--accent);border-color:var(--accent)}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.grid{max-width:1400px;margin:0 auto;padding:28px 32px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(26,26,46,.12)}
.card img{width:100%;display:block;background:#eceae3;min-height:120px}
.meta{padding:10px 14px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meta .t{font-size:13.5px;font-weight:600;line-height:1.3}
.meta .d{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tag{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
dialog{border:none;border-radius:18px;padding:0;max-width:min(1200px,94vw);width:94vw;max-height:92vh;background:var(--card)}
dialog::backdrop{background:rgba(26,26,46,.55);backdrop-filter:blur(4px)}
.modal{display:flex;flex-direction:column;max-height:92vh}
.mhead{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line)}
.mhead h2{font-family:Fraunces,serif;font-size:22px;font-weight:600;flex:1}
.mhead .d{color:var(--muted);font-size:13px}
.mhead a{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.mbody{overflow:auto;padding:20px 24px}
.mbody img{max-width:100%;display:block;margin:0 auto;border-radius:10px}
details{margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:14px;background:var(--paper)}
pre{margin:0;max-height:60vh;overflow:auto}
code.hljs{font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:16px}
@media (max-width:640px){.grid{padding:20px 16px}header{padding:36px 16px 12px}.bar-inner{padding:10px 16px}}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card{text-align:left;color:var(--ink);width:100%}
#search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--card);font-size:14px}
#status{font-size:12px;color:var(--muted);flex-basis:100%}
#filters{display:flex;flex-wrap:wrap;gap:6px}
#empty{text-align:center;padding:32px}
#packages{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 16px;overflow-wrap:anywhere}
.plot-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:12px;color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
.mhead{flex-wrap:wrap}.mhead h2{min-width:180px}
#mc{display:block;padding:16px;white-space:pre}
@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}.mhead,.mbody{padding:16px}#filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding:4px}.chip{white-space:nowrap}.mhead h2{font-size:20px}.bar-inner{gap:6px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header>
  <h1>tidytuesday<span>.</span></h1>
  <p class="sub">Every visualisation from <a href="https://github.com/nrennie/tidytuesday" style="color:var(--accent)">nrennie/tidytuesday</a>, newest first. Click a plot to see it full size with the code that made it.</p>
</header>
<div class="bar"><div class="bar-inner">
  <input id="search" type="search" aria-label="Search plots, dates or packages" placeholder="Search topics, dates or packages…">
  <button class="chip" id="surprise">Surprise me</button>
  <button class="chip" id="refresh">Refresh</button>
  <span id="status" role="status">Checking for new plots…</span>
  <div id="filters" aria-label="Filter plots"></div>
  <span class="count" id="count" role="status"></span>
</div></div>
<main class="grid" id="grid" aria-label="Plot gallery"></main>
<p id="empty" hidden>No plots match. <button class="chip" id="clear">Clear filters</button></p>
<dialog id="dlg" aria-labelledby="mt"><div class="modal">
  <div class="mhead"><h2 id="mt"></h2><span class="d" id="md"></span><a id="mg" target="_blank" rel="noopener noreferrer">GitHub &rarr;</a><button class="close" id="close" aria-label="Close plot">&times;</button></div>
  <div class="mbody"><div class="plot-nav"><button class="chip" id="prev">← Previous</button><span id="position"></span><button class="chip" id="next">Next →</button></div><p id="packages"></p><img id="mi" alt=""><details id="mdet"><summary id="msum">Show code</summary><pre><code id="mc" class="language-r"></code></pre></details></div>
</div></dialog>
<script src="vendor/papaparse.min.js"></script>
<script src="snapshot.js"></script>
<script src="catalog.js"></script>
<script src="gallery.js"></script>
</body>
</html>
