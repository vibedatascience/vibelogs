<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books</title>
<style>
body{background:#fff;color:#111;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;margin:24px;max-width:760px}
a{color:#00e}
a:visited{color:#551a8b}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#666;margin:0 0 20px;font-size:14px}
.book{display:flex;gap:16px;padding:16px 0;border-top:1px solid #eee}
.book img{width:96px;height:auto;flex:none;border:1px solid #ddd;align-self:flex-start}
.t{font-weight:600;font-size:16px;margin:0}
.a{color:#555;margin:0 0 6px}
.meta{font-size:13px;color:#666;margin:0 0 8px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;margin-right:6px}
.read{background:#e7f6ec;color:#0f6b34}
.partial{background:#fff4e0;color:#8a5300}
.stars{color:#E60023;letter-spacing:1px}
.n{margin:0}
@media(max-width:480px){body{margin:16px}.book img{width:72px}}
</style>
</head>
<body>
<p><a href="../">Rahul's Site</a></p>
<h1>Books</h1>
<p class="sub">Books I have read or partly read, with a few notes.</p>
<div id="list"></div>
<script>
// Add new books at the top. status: "read" | "partial" | "" ; rating: 1-5 or null
const BOOKS = [
  {
    title: "AI Snake Oil",
    subtitle: "What Artificial Intelligence Can Do, What It Can't, and How to Tell the Difference",
    authors: "Arvind Narayanan, Sayash Kapoor",
    cover: "covers/ai-snake-oil.jpg",
    status: "",
    rating: null,
    notes: "It was written before the really good models arrived (Opus 4.5+ class), so the authors are more dismissive of AI doomers. Their points about traditional ML are spot on."
  }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("list").innerHTML = BOOKS.map(b => {
  const tag = b.status ? `<span class="tag ${b.status}">${b.status === "read" ? "Read" : "Partly read"}</span>` : "";
  const stars = b.rating ? `<span class="stars">${"★".repeat(b.rating)}${"☆".repeat(5 - b.rating)}</span>` : "";
  const meta = tag || stars ? `<p class="meta">${tag}${stars}</p>` : "";
  return `<div class="book">
    <img src="${esc(b.cover)}" alt="${esc(b.title)} cover" loading="lazy">
    <div>
      <p class="t">${esc(b.title)}</p>
      <p class="a">${esc(b.authors)}</p>
      ${meta}
      ${b.notes ? `<p class="n">${esc(b.notes)}</p>` : ""}
    </div>
  </div>`;
}).join("");
</script>
</body>
</html>
